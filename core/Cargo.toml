[workspace]
resolver = "2"
members = ["sysflow-core", "sysflow-modules", "sysflow-cli", "sysflow-types"]

[workspace.package]
version = "0.3.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sysflow-core = { path = "sysflow-core" }
sysflow-modules = { path = "sysflow-modules" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
