name: ci
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: Generated protocol types are up to date
        working-directory: .
        run: |
          tools/gen-types.sh
          git diff --exit-code -- \
            webui/src/generated/protocol.ts \
            app/src/main/kotlin/io/sysflow/core/model/Protocol.kt

  module-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in module/*.sh tools/*.sh; do sh -n "$f"; done

  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - run: npm run build
        working-directory: webui

  android-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.1" "build-tools;37.0.0"
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sysflow-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  android-binary:
    runs-on: ubuntu-latest
    needs: [rust, module-scripts, webui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci && npm run build
        working-directory: webui
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo install cargo-ndk
      - run: cargo ndk -t arm64-v8a build --release -p sysflow-cli
        working-directory: core
      - run: sh tools/pack-module.sh core/target/aarch64-linux-android/release/sysflow
      - uses: actions/upload-artifact@v4
        with:
          name: sysflow-module
          path: dist/*
